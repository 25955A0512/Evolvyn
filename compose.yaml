services:
  db:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_USER: evolvyn
      POSTGRES_DB: evolvyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare_deployment.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U evolvyn]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  vault_init:
    image: python:3.12.14-slim
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./.local/vault.key:/source/vault.key:ro
      - vault_secrets:/vault
    command:
      - python
      - -c
      - |
        import os
        from pathlib import Path
        source=Path('/source/vault.key').read_bytes()
        target=Path('/vault/vault.key')
        if target.exists() and target.read_bytes()!=source:
            raise SystemExit('Vault master key mismatch. Restore the original private key before starting.')
        if not target.exists():
            descriptor=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
            with os.fdopen(descriptor,'wb') as stream: stream.write(source)
        os.chown(target,10001,10001)
        target.chmod(0o600)
  api:
    build: .
    env_file:
      - path: .local/mcp-secrets.env
        required: false
        format: raw
    environment:
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      EVOLVYN_HELP_GEMINI_KEY: ${EVOLVYN_HELP_GEMINI_KEY:-}
      EVOLVYN_HELP_GEMINI_MODEL: ${EVOLVYN_HELP_GEMINI_MODEL:-}
      EVOLVYN_HELP_GROQ_KEY: ${EVOLVYN_HELP_GROQ_KEY:-}
      EVOLVYN_HELP_GROQ_MODEL: ${EVOLVYN_HELP_GROQ_MODEL:-}
      APP_ENV: production
      EVOLVYN_VAULT_KEY_FILE: /run/evolvyn-secrets/vault.key
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,db,api
      DATABASE_URL: postgresql://evolvyn:${POSTGRES_PASSWORD}@db:5432/evolvyn
      EVOLVYN_ACCESS_TOKEN: ${EVOLVYN_ACCESS_TOKEN}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    extra_hosts:
      - "${EVOLVYN_PROXY_HOST:-proxy}:${EVOLVYN_PROXY_IP:-127.0.0.1}"
    volumes:
      - vault_secrets:/run/evolvyn-secrets:ro
      - ./.local/models:/models:ro
      - ./.local/llama:/runtime:ro
    depends_on:
      vault_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,pathlib; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3); not pathlib.Path('/models/qwen2.5-1.5b-instruct-q4_k_m.gguf').is_file() or urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: frontend
    ports:
      - 127.0.0.1:3000:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  vault_secrets:
